<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>SiPAM — Sistem Pembayaran Air Minum</title>
<style>
/* ========== SEMUA CSS DARI style.css MASUK SINI ========== */
:root {
  --c-bg: #F0F4F8;
  --c-surface: #FFFFFF;
  --c-primary: #0F52A0;
  --c-green: #0D9E5C;
  --c-red: #DC2626;
  --c-text: #1A202C;
  --nav-h: 64px;
}
/* ... copy semua CSS dari style.css ke sini ... */
</style>
</head>
<body>
<div id="app">

<!-- ══════════ LOGIN ══════════ -->
<div class="page active" id="pg-login">
  <div class="login-logo">
    <div class="drop">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24"><path d="M12 2C12 2 5 10.5 5 15a7 7 0 0014 0C19 10.5 12 2 12 2z" fill="white" opacity=".9"/></svg>
    </div>
    <h1>SiPAM</h1>
    <p>Sistem Pembayaran Air Minum</p>
  </div>
  <div class="login-card">
    <h2>Masuk ke sistem</h2>
    <div class="login-err" id="login-err"></div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-input" id="inp-username" type="text" placeholder="Masukkan username"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="inp-password" type="password" placeholder="Masukkan password"/>
    </div>
    <button class="btn btn-primary" id="btn-login">Masuk</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== SEMUA JAVASCRIPT (config + app) LANGSUNG DI SINI ==========

// ════════════════════════════════════════════════════════
//  KONFIGURASI
// ════════════════════════════════════════════════════════

// GANTI DENGAN URL APPS SCRIPT ANDA (dari akun andangchris91)
const API_URL_ORIGIN = "https://script.google.com/macros/s/URL_BARU_ANDA/exec";
const USE_JSONP = true;
const USE_DEMO_MODE = false;  // Set ke true jika masih error

const BULAN_INI = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][new Date().getMonth()];
const TAHUN_INI = new Date().getFullYear();

// ════════════════════════════════════════════════════════
//  STATE & DEMO DATA
// ════════════════════════════════════════════════════════

let session = JSON.parse(sessionStorage.getItem("sipam_session") || "null");
let allPelanggan = [];
let currentPel = null;
let currentTrx = null;
let metodeAktif = "Tunai";
let fromPage = "dashboard";

const DEMO_USERS = [
  { username: "admin", password: "admin123", nama: "Administrator", role: "admin" },
  { username: "petugas.a", password: "petugas123", nama: "Petugas Lapangan A", role: "petugas" },
];

const DEMO_PEL = [
  { id_pelanggan: "PLG-001", no_rumah: "A-01", nama: "Budi Santoso", alamat: "Jl. Mawar No. 1", no_telpon: "081234567890" },
  { id_pelanggan: "PLG-002", no_rumah: "A-02", nama: "Siti Rahayu", alamat: "Jl. Mawar No. 2", no_telpon: "081234567891" },
];

let DEMO_TRX = [
  { id_transaksi: "TRX-001", id_pelanggan: "PLG-001", no_rumah: "A-01", nama: "Budi Santoso", pemakaian: 15, jumlah_bayar: 27500, status: "Belum Bayar", tgl_bayar: "" },
  { id_transaksi: "TRX-002", id_pelanggan: "PLG-002", no_rumah: "A-02", nama: "Siti Rahayu", pemakaian: 17, jumlah_bayar: 30500, status: "Belum Bayar", tgl_bayar: "" },
];

// ════════════════════════════════════════════════════════
//  API CALL (JSONP)
// ════════════════════════════════════════════════════════

async function api(body) {
  if (USE_DEMO_MODE) {
    return demoApi(body);
  }
  
  return new Promise((resolve) => {
    try {
      const callbackName = "jsonp_cb_" + Date.now() + "_" + Math.random().toString(36).substr(2, 8);
      const params = new URLSearchParams();
      params.append("data", JSON.stringify(body));
      params.append("callback", callbackName);
      
      const url = API_URL_ORIGIN + "?" + params.toString();
      console.log("JSONP Request:", url);
      
      window[callbackName] = function(data) {
        console.log("Response:", data);
        delete window[callbackName];
        document.body.removeChild(script);
        resolve(data);
      };
      
      const script = document.createElement("script");
      script.src = url;
      script.onerror = function() {
        console.error("JSONP Failed, using demo");
        delete window[callbackName];
        document.body.removeChild(script);
        resolve(demoApi(body));
      };
      
      document.body.appendChild(script);
      
      setTimeout(() => {
        if (window[callbackName]) {
          console.warn("JSONP timeout");
          delete window[callbackName];
          resolve(demoApi(body));
        }
      }, 10000);
    } catch(error) {
      console.error("API Error:", error);
      resolve(demoApi(body));
    }
  });
}

async function demoApi(body) {
  await new Promise(r => setTimeout(r, 350));
  const { action } = body;
  
  if (action === "login") {
    const u = DEMO_USERS.find(x => x.username === body.username && x.password === body.password);
    if (!u) return { status: "error", message: "Username atau password salah." };
    return { status: "ok", token: "demo-token", nama: u.nama, role: u.role, id_user: "USR-DEMO" };
  }
  if (action === "getPelanggan") return { status: "ok", data: DEMO_PEL };
  if (action === "searchPelanggan") {
    const kw = body.keyword.toLowerCase();
    return { status: "ok", data: DEMO_PEL.filter(p => p.no_rumah.toLowerCase().includes(kw) || p.nama.toLowerCase().includes(kw)) };
  }
  if (action === "getLastMeter") return { status: "ok", meter_berjalan: null };
  if (action === "saveMeteran") return { status: "ok", message: "Data meteran disimpan" };
  if (action === "saveTransaksi") {
    const t = DEMO_TRX.find(x => x.id_transaksi === body.id_transaksi);
    if (t) { t.status = "Lunas"; t.tgl_bayar = new Date().toISOString().split("T")[0]; }
    return { status: "ok", message: "Pembayaran berhasil" };
  }
  if (action === "getLaporan") {
    const lunas = DEMO_TRX.filter(t => t.status === "Lunas");
    const belum = DEMO_TRX.filter(t => t.status === "Belum Bayar");
    return {
      status: "ok",
      laporan: {
        bulan: BULAN_INI, tahun: TAHUN_INI,
        total_pelanggan: DEMO_TRX.length,
        sudah_bayar: lunas.length,
        belum_bayar: belum.length,
        total_terkumpul: 0,
        total_piutang: 0
      },
      detail: DEMO_TRX
    };
  }
  return { status: "error", message: "Action tidak dikenal" };
}

// ════════════════════════════════════════════════════════
//  LOGIN FUNCTION
// ════════════════════════════════════════════════════════

async function doLogin() {
  const username = document.getElementById("inp-username").value.trim();
  const password = document.getElementById("inp-password").value;
  const errEl = document.getElementById("login-err");
  const btn = document.getElementById("btn-login");
  
  if (!username || !password) {
    errEl.textContent = "Username dan password wajib diisi.";
    errEl.style.display = "block";
    return;
  }
  
  btn.textContent = "Memverifikasi...";
  btn.disabled = true;
  
  const res = await api({ action: "login", username, password });
  
  btn.innerHTML = "Masuk";
  btn.disabled = false;
  
  if (res.status !== "ok") {
    errEl.textContent = res.message;
    errEl.style.display = "block";
    return;
  }
  
  errEl.style.display = "none";
  session = { token: res.token, nama: res.nama, role: res.role, id_user: res.id_user };
  sessionStorage.setItem("sipam_session", JSON.stringify(session));
  
  // Tampilkan dashboard sederhana
  document.getElementById("pg-login").classList.remove("active");
  document.getElementById("pg-dashboard").classList.add("active");
  document.getElementById("dash-greeting").textContent = "Selamat datang, " + (session?.role === "admin" ? "Admin" : "Petugas");
  document.getElementById("dash-nama").textContent = session?.nama || "—";
  
  showToast("Login berhasil! Selamat datang " + session.nama, "success");
}

function doLogout() {
  sessionStorage.removeItem("sipam_session");
  session = null;
  document.getElementById("pg-dashboard").classList.remove("active");
  document.getElementById("pg-login").classList.add("active");
  document.getElementById("inp-username").value = "";
  document.getElementById("inp-password").value = "";
  showToast("Anda telah logout", "success");
}

function showToast(msg, type) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "toast show " + type;
  setTimeout(() => toast.className = "toast", 3000);
}

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════

document.addEventListener("DOMContentLoaded", function() {
  console.log("App loaded");
  
  // Attach event listeners
  const loginBtn = document.getElementById("btn-login");
  if (loginBtn) {
    loginBtn.onclick = doLogin;
  }
  
  const passwordInput = document.getElementById("inp-password");
  if (passwordInput) {
    passwordInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") doLogin();
    });
  }
  
  // Check existing session
  if (session?.token) {
    document.getElementById("pg-login").classList.remove("active");
    document.getElementById("pg-dashboard").classList.add("active");
    document.getElementById("dash-greeting").textContent = "Selamat datang kembali";
    document.getElementById("dash-nama").textContent = session?.nama || "—";
  }
  
  // Setup logout button
  const logoutBtn = document.querySelector(".topbar-icon");
  if (logoutBtn) {
    logoutBtn.onclick = doLogout;
  }
  
  // Setup bottom nav buttons
  const navItems = document.querySelectorAll(".nav-item");
  navItems.forEach(item => {
    item.onclick = function() {
      const page = this.textContent.trim().toLowerCase();
      if (page === "dashboard") {
        document.getElementById("pg-dashboard").classList.add("active");
        document.getElementById("pg-pelanggan")?.classList.remove("active");
        document.getElementById("pg-meteran")?.classList.remove("active");
        document.getElementById("pg-laporan")?.classList.remove("active");
      } else if (page === "cari") {
        document.getElementById("pg-pelanggan")?.classList.add("active");
        document.getElementById("pg-dashboard").classList.remove("active");
        document.getElementById("pg-meteran")?.classList.remove("active");
        document.getElementById("pg-laporan")?.classList.remove("active");
      } else if (page === "catat") {
        document.getElementById("pg-meteran")?.classList.add("active");
        document.getElementById("pg-dashboard").classList.remove("active");
        document.getElementById("pg-pelanggan")?.classList.remove("active");
        document.getElementById("pg-laporan")?.classList.remove("active");
      } else if (page === "laporan") {
        document.getElementById("pg-laporan")?.classList.add("active");
        document.getElementById("pg-dashboard").classList.remove("active");
        document.getElementById("pg-pelanggan")?.classList.remove("active");
        document.getElementById("pg-meteran")?.classList.remove("active");
      }
    };
  });
  
  console.log("Event listeners attached");
});
</script>

<style>

</style>
</body>
</html>
